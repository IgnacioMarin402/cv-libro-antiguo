# On every push to master: build the image, push it to GitHub's registry,
# and replace the app container on the VPS. The database is in a volume the
# container only mounts, so it stays (see deploy/compose.yaml).
#
# Off until the repository has the variable VPS_HOST (Settings → Secrets and
# variables → Actions → Variables): before there's a server, a push builds
# nothing. See deploy/README.md for the rest of what it needs.
name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the one running.
concurrency: deploy

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ vars.VPS_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The registry wants the name in lowercase; the owner isn't.
      - name: Image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }},${{ env.IMAGE }}:latest
          # Ties the package to this repository, so the job's token can pull it.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: SSH key
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The image is pinned by commit in .env, so a later `docker compose up`
      # by hand runs this same one. The token only lives as long as this
      # job: the VPS logs in to pull and out again.
      - name: Deploy
        env:
          TARGET: ${{ vars.VPS_USER || 'deploy' }}@${{ vars.VPS_HOST }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scp deploy/compose.yaml deploy/backup.sh "$TARGET:/opt/libro/"
          scp deploy/Caddyfile "$TARGET:/opt/libro/caddy/"
          ssh "$TARGET" sh -eu <<EOF
          cd /opt/libro
          sed -i '/^IMAGE=/d' .env
          echo 'IMAGE=$IMAGE:${{ github.sha }}' >> .env
          echo '$TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker compose pull app
          docker logout ghcr.io
          docker compose up -d --remove-orphans
          # Caddy reads its file only on start; a changed one is reloaded.
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
          for i in \$(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/love >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/love
          echo
          docker image prune -f
          EOF
